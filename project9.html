<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>css box</title>
 <style>
 div {
 height: 200px;
 width: 200px;
 }
 p {
 margin: 0;
 }
 #first {
 background-color: indigo;
 padding: 20px;
 border: 10px solid red;
 }
 #second {
 background-color: pink;
 border: solid blue;
 border-width: 20px 10px;
 margin-left: 220px;
 }
 #third {
 background-color:yellow;
 border: 10px solid blue;
 margin-left: 40px;
 }
 </style>
</head>
<body>
 <div id="first">
 <p>This is box one</p>
 </div>
 <div id="second">
 </div>
 <div id="third">
 </div>
</body>
</html>
